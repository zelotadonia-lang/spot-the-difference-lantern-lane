<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lane — Cari Perbedaannya</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d24; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern Lane: cari perbedaan di antara dua gambar pasar malam, klik perbedaannya"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
